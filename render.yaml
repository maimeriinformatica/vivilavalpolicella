services:
  - type: web
    name: vivilavalpolicella
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    domains:
      - vivilavalpolicella.it
      - www.vivilavalpolicella.it
